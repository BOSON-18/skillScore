version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: skillscore-postgres
    environment:
      POSTGRES_USER: skillscore
      POSTGRES_PASSWORD: skillscore
      POSTGRES_DB: skillscore
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillscore"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
